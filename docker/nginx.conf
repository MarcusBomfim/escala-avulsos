# O aplicativo de produção e a API na mesma origem, como em desenvolvimento
# (ADR-0023): o nginx serve o que o Vite compilou e repassa /api para a API.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Só o que é desta origem roda: o aplicativo não carrega nada de fora. O
    # service worker e o manifesto também são desta origem.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # A resposta da API passa como veio, sem compressão: o gzip do nginx
    # enfraquece a ETag — "3" vira W/"3" —, o aplicativo devolve a fraca no
    # If-Match, e a API, que compara forte, recusaria toda alteração
    # (ADR-0014). É JSON pequeno; o que pesa, os arquivos do Vite, segue
    # comprimido.
    #
    # Os eventos do servidor (ADR-0020) passam por aqui também, cada um na
    # hora, e o teste das imagens confere. A API responde com
    # X-Accel-Buffering: no, para nenhum proxy no caminho guardar o evento à
    # espera de juntar um bloco; e o sinal de vida, a cada vinte segundos,
    # mantém a ligação bem abaixo do limite de leitura do nginx.
    location /api/ {
        gzip off;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # O manifesto do aplicativo instalável, com o tipo que o navegador espera.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
        expires -1;
    }

    # O nome dos arquivos do Vite muda quando o conteúdo muda: cache de um ano.
    location /assets/ {
        expires 1y;
    }

    # O resto é revalidado a cada abertura: as rotas do React, que são o
    # index.html, e o service worker, que guardado em cache deixaria o celular
    # com a casca velha mesmo depois de uma versão nova.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
